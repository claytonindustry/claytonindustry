name: Build image manifest

on:
  push:
    paths:
      - 'images/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: bash scripts/build-manifest.sh

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- images/manifest.json; then
            echo "Manifest unchanged, nothing to commit"
          else
            git add images/manifest.json
            git commit -m "Auto-update image manifest"
            git push
          fi
